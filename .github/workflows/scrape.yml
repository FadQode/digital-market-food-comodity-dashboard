name: Weekly marketplace scrape

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: ingestion/scraper-go/go.sum

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/migrate.sh

      - name: Run scraper
        env:
          TOKOPEDIA_APIFY_KEY: ${{ secrets.TOKOPEDIA_APIFY_KEY }}
          SHOPEE_APIFY_KEY: ${{ secrets.SHOPEE_APIFY_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPE_JOBS: tokopedia,shopee
          SCRAPE_CITY: surabaya
          SCRAPE_QUERY: beras 5 kg
          ALLOW_PAID_APIS: "true"
          MARKETPLACE_MAX_ITEMS: "20"
          APIFY_MAX_CHARGE_USD: "0.07"
        working-directory: ingestion/scraper-go
        run: go run ./cmd/scraper

      - name: Upload raw scrape output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-scrape-${{ github.run_id }}
          path: data/raw/run-*.json
          if-no-files-found: warn
          retention-days: 14
