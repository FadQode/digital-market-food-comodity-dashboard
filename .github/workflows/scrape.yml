name: Daily scrape

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: ingestion/scraper-go/go.sum

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/migrate.sh

      - name: Run scraper
        env:
          APIFY_TOKOPEDIA_TOKEN: ${{ secrets.APIFY_TOKOPEDIA_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPE_CITY: surabaya
          SCRAPE_QUERY: beras
        working-directory: ingestion/scraper-go
        run: go run ./cmd/scraper
